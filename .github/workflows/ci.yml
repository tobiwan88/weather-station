name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CI_IMAGE: ghcr.io/tobiwan88/zephyr_docker:arm
  VENV: /home/zephyr/.venv/bin/activate

defaults:
  run:
    shell: bash

jobs:
  # ── 1. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tobiwan88/zephyr_docker:arm
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure git user
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"

      - name: Install pre-commit
        run: source /home/zephyr/.venv/bin/activate && pip install pre-commit --quiet

      - name: Run pre-commit hooks
        run: source /home/zephyr/.venv/bin/activate && pre-commit run --all-files

  # ── 2. Build (parallel per app) ─────────────────────────────────────────────
  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: ghcr.io/tobiwan88/zephyr_docker:arm
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: gateway
            board: native_sim/native/64
            board-label: native64
          - app: sensor-node
            board: native_sim/native/64
            board-label: native64
          - app: outdoor_sensor_node
            board: native_sim/native/64
            board-label: native64
          - app: outdoor_sensor_node
            board: lora_e5_mini
            board-label: lora-e5-mini
          - app: gateway
            board: frdm_mcxn947/mcxn947/cpu0
            board-label: frdm-mcxn947

    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory '*'

      - name: Configure git user
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../zephyr
            ${{ github.workspace }}/../modules
          key: west-${{ hashFiles('west.yml') }}
          restore-keys: west-

      - name: West init + update
        run: |
          source /home/zephyr/.venv/bin/activate
          west init -l . 2>/dev/null || true
          west update --narrow

      - name: Apply out-of-tree patches
        run: |
          source /home/zephyr/.venv/bin/activate
          west patch apply

      - name: Install build dependencies
        run: apt-get update -qq && apt-get install -y --no-install-recommends pkgconf libsdl2-dev

      - name: Build ${{ matrix.app }}
        run: |
          source /home/zephyr/.venv/bin/activate
          WEST_ROOT=$(west topdir)
          # ZEPHYR_EXTRA_MODULES is required: Zephyr CMake does not scan the
          # west manifest's self: project automatically for zephyr/module.yml.
          # Build dir is inside GITHUB_WORKSPACE to keep artifact paths simple.
          ZEPHYR_EXTRA_MODULES="${WEST_ROOT}/weather-station" \
          ZEPHYR_BASE="${WEST_ROOT}/zephyr" \
            west build -p always -b ${{ matrix.board }} \
              --build-dir "${GITHUB_WORKSPACE}/build/${{ matrix.app }}" \
              "${WEST_ROOT}/weather-station/apps/${{ matrix.app }}"

      - name: Build ${{ matrix.app }} (sysbuild)
        if: ${{ matrix.board == 'frdm_mcxn947/mcxn947/cpu0' }}
        run: |
          source /home/zephyr/.venv/bin/activate
          WEST_ROOT=$(west topdir)
          # Generate ephemeral dev signing key for MCUboot
          "${WEST_ROOT}/weather-station/scripts/gen-dev-key.sh"
          ZEPHYR_EXTRA_MODULES="${WEST_ROOT}/weather-station" \
          ZEPHYR_BASE="${WEST_ROOT}/zephyr" \
            west build -p always -b ${{ matrix.board }} \
              --sysbuild \
              --build-dir "${GITHUB_WORKSPACE}/build/${{ matrix.app }}" \
              "${WEST_ROOT}/weather-station/apps/${{ matrix.app }}" \
              -- \
              -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"${WEST_ROOT}/weather-station/keys/dev-ed25519.pem\"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.board-label }}
          path: build/${{ matrix.app }}/zephyr/zephyr.exe
          retention-days: 7

      - name: Upload ELF binary (ARM)
        if: ${{ matrix.board-label != 'native64' && matrix.board != 'frdm_mcxn947/mcxn947/cpu0' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.board-label }}
          path: build/${{ matrix.app }}/zephyr/zephyr.elf
          retention-days: 7

      - name: Upload sysbuild binaries
        if: ${{ matrix.board == 'frdm_mcxn947/mcxn947/cpu0' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.board-label }}-sysbuild
          path: |
            build/${{ matrix.app }}/gateway/zephyr/zephyr.elf
            build/${{ matrix.app }}/gateway/zephyr/zephyr.signed.bin
            build/${{ matrix.app }}/mcuboot/zephyr/zephyr.elf
          retention-days: 7

  # ── 3. Renode ─────────────────────────────────────────────────────────────────
  renode:
    name: Renode (${{ matrix.test }})
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: ghcr.io/tobiwan88/zephyr_docker:arm
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        test:
          - gateway_boot
          - gateway_fota

    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory '*'

      - name: Configure git user
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../zephyr
            ${{ github.workspace }}/../modules
          key: west-${{ hashFiles('west.yml') }}
          restore-keys: west-

      - name: West init + update
        run: |
          source /home/zephyr/.venv/bin/activate
          west init -l . 2>/dev/null || true
          west update --narrow

      - name: Apply out-of-tree patches
        run: |
          source /home/zephyr/.venv/bin/activate
          west patch apply

      - name: Build gateway for Renode
        run: |
          source /home/zephyr/.venv/bin/activate
          WEST_ROOT=$(west topdir)
          "${WEST_ROOT}/weather-station/scripts/gen-dev-key.sh"
          ZEPHYR_EXTRA_MODULES="${WEST_ROOT}/weather-station" \
          ZEPHYR_BASE="${WEST_ROOT}/zephyr" \
            west build -p always -b frdm_mcxn947/mcxn947/cpu0 \
              --sysbuild \
              --build-dir "${GITHUB_WORKSPACE}/build/renode/gateway" \
              "${WEST_ROOT}/weather-station/apps/gateway" \
              -- \
              -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"${WEST_ROOT}/weather-station/keys/dev-ed25519.pem\" \
              -DDTC_OVERLAY_FILE="boards/frdm_mcxn947_mcxn947_cpu0.overlay;boards/frdm_mcxn947_mcxn947_cpu0_renode.overlay" \
              -DEXTRA_CONF_FILE="boards/frdm_mcxn947_mcxn947_cpu0_renode.conf;boards/frdm_mcxn947_mcxn947_cpu0_trace_recorder.conf"

      - name: Install libicu and curl (Renode deps)
        run: apt-get update -qq && apt-get install -y -qq libicu-dev curl

      - name: Install Renode portable
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64|arm64) ASSET="renode-1.16.1.linux-arm64-portable-dotnet.tar.gz" ;;
            *)              ASSET="renode-1.16.1.linux-portable-dotnet.tar.gz" ;;
          esac
          mkdir -p /opt/renode
          curl -L --retry 3 \
            "https://github.com/renode/renode/releases/download/v1.16.1/${ASSET}" \
            | tar xz --strip-components=1 -C /opt/renode
          echo "/opt/renode" >> "$GITHUB_PATH"

      - name: Install Robot Framework
        run: pip install robotframework==6.1

      - name: Run ${{ matrix.test }}
        run: |
          renode-test \
            --show-log \
            simulation/renode/tests/${{ matrix.test }}.robot

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-${{ matrix.test }}
          path: |
            robot_output.xml
            log.html
            report.html
            simulation/renode/trace.bin
            simulation/renode/trace_functions.perfetto
            build/renode/gateway/zephyr/zephyr.elf
          retention-days: 14

  # ── 4. Test + Coverage ───────────────────────────────────────────────────────
  test-and-coverage:
    name: Test + Coverage
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
      contents: read
    container:
      image: ghcr.io/tobiwan88/zephyr_docker:arm
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory '*'

      - name: Configure git user
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../zephyr
            ${{ github.workspace }}/../modules
          key: west-${{ hashFiles('west.yml') }}
          restore-keys: west-

      - name: West init + update
        run: |
          source /home/zephyr/.venv/bin/activate
          west init -l . 2>/dev/null || true
          west update --narrow

      - name: Apply out-of-tree patches
        run: |
          source /home/zephyr/.venv/bin/activate
          west patch apply

      - name: Install gcovr
        run: source /home/zephyr/.venv/bin/activate && pip install gcovr --quiet

      - name: Run Twister with coverage
        run: |
          source /home/zephyr/.venv/bin/activate
          WEST_ROOT=$(west topdir)
          export ZEPHYR_EXTRA_MODULES="${WEST_ROOT}/weather-station"
          export ZEPHYR_BASE="${WEST_ROOT}/zephyr"
          west twister \
            -p native_sim/native/64 \
            -T "${WEST_ROOT}/weather-station/tests/" \
            --coverage \
            --coverage-tool gcovr \
            --inline-logs \
            -v -N \
            --outdir "${GITHUB_WORKSPACE}/twister-out"

      - name: Generate coverage reports
        if: always()
        run: |
          source /home/zephyr/.venv/bin/activate
          mkdir -p "${GITHUB_WORKSPACE}/twister-out/coverage"
          gcovr \
            --root "${GITHUB_WORKSPACE}/.." \
            --filter ".*/weather-station/.*" \
            --exclude ".*/zephyr/.*" \
            --exclude ".*/modules/.*" \
            --exclude ".*/tests/.*" \
            --html-details "${GITHUB_WORKSPACE}/twister-out/coverage/index.html" \
            --xml "${GITHUB_WORKSPACE}/twister-out/coverage.xml" \
            --print-summary \
            2>/dev/null || true

      - name: Upload Twister results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-results
          path: twister-out/
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            twister-out/coverage/
            twister-out/coverage.xml
          retention-days: 14

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Ztest Results
          path: twister-out/**/twister.xml
          reporter: java-junit
          fail-on-error: false

  # ── 5. Docs (MkDocs build) ───────────────────────────────────────────────────
  docs:
    name: Docs (MkDocs build)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Install MkDocs, Material theme, and Mermaid plugin
        run: pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin mkdocs-glightbox

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site/
          retention-days: 14

  # ── 6. Snapshot (PR only) ────────────────────────────────────────────────────
  snapshot:
    name: Publish PR snapshot
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [build, test-and-coverage, docs]

    steps:
      - name: Download gateway binary
        uses: actions/download-artifact@v4
        with:
          name: gateway-native64
          path: snapshot/binaries/gateway/

      - name: Download sensor-node binary
        uses: actions/download-artifact@v4
        with:
          name: sensor-node-native64
          path: snapshot/binaries/sensor-node/

      - name: Download outdoor-sensor-node binary
        uses: actions/download-artifact@v4
        with:
          name: outdoor_sensor_node-native64
          path: snapshot/binaries/outdoor_sensor_node/native_sim/

      - name: Download outdoor-sensor-node (lora_e5_mini) binary
        uses: actions/download-artifact@v4
        with:
          name: outdoor_sensor_node-lora-e5-mini
          path: snapshot/binaries/outdoor_sensor_node/lora_e5_mini/

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: snapshot/coverage/

      - name: Download MkDocs site
        uses: actions/download-artifact@v4
        with:
          name: mkdocs-site
          path: snapshot/docs/

      - name: Download Twister results
        uses: actions/download-artifact@v4
        with:
          name: twister-results
          path: snapshot/twister/

      - name: Upload PR snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pr-snapshot-${{ github.event.pull_request.number }}
          path: snapshot/
          retention-days: 30

  # ── 7. Deploy results to gh-pages ──────────────────────────────────────────
  deploy-results:
    name: Deploy results to gh-pages
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'pull_request'
    needs: [test-and-coverage, renode]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: /tmp/deploy/coverage/
        continue-on-error: true

      - name: Download Twister results
        uses: actions/download-artifact@v4
        with:
          name: twister-results
          path: /tmp/deploy/twister/
        continue-on-error: true

      - name: Download Renode boot trace
        uses: actions/download-artifact@v4
        with:
          name: renode-gateway_boot
          path: /tmp/deploy/renode/
        continue-on-error: true

      - name: Determine target directory on gh-pages
        id: dir
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "path=dev/traces/pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=dev/traces/master" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to gh-pages
        run: |
          TARGET_DIR="${{ steps.dir.outputs.path }}"
          git fetch origin gh-pages
          git checkout gh-pages
          rm -rf deploy/                # remove accidentally-committed staging dir
          mkdir -p "$TARGET_DIR"
          # Remove old results for this ref (overwrite, not accumulate)
          [[ -n "$TARGET_DIR" && "$TARGET_DIR" == dev/traces/* ]] || { echo "ERROR: unsafe TARGET_DIR"; exit 1; }
          rm -rf "$TARGET_DIR"/*
          # Copy new results
          if [ -d /tmp/deploy/coverage ] && [ "$(ls -A /tmp/deploy/coverage 2>/dev/null)" ]; then
            mkdir -p "$TARGET_DIR/coverage"
            cp -r /tmp/deploy/coverage/* "$TARGET_DIR/coverage/"
          fi
          if [ -d /tmp/deploy/twister ] && [ "$(ls -A /tmp/deploy/twister 2>/dev/null)" ]; then
            mkdir -p "$TARGET_DIR/twister"
            cp -r /tmp/deploy/twister/* "$TARGET_DIR/twister/"
          fi
          if [ -d /tmp/deploy/renode ] && [ "$(ls -A /tmp/deploy/renode 2>/dev/null)" ]; then
            mkdir -p "$TARGET_DIR/renode"
            cp -r /tmp/deploy/renode/* "$TARGET_DIR/renode/"
            # If trace files exist, parse and deploy Perfetto/Chrome trace
            TRACE_BIN="/tmp/deploy/renode/simulation/renode/trace.bin"
            TRACE_ELF="/tmp/deploy/renode/build/renode/gateway/zephyr/zephyr.elf"
            if [ -f "$TRACE_BIN" ] && [ -f "$TRACE_ELF" ]; then
              python3 scripts/parse-trace.py \
                --trace "$TRACE_BIN" \
                --elf "$TRACE_ELF" \
                --output "$TARGET_DIR/trace_combined.json" \
                --summary || echo "WARNING: trace parsing failed"
              REPO_OWNER="$(echo '${{ github.repository }}' | cut -d/ -f1)"
              REPO_NAME="$(echo '${{ github.repository }}' | cut -d/ -f2)"
              echo "Perfetto deep-link: https://ui.perfetto.dev/#!/?url=https://${REPO_OWNER}.github.io/${REPO_NAME}/${TARGET_DIR}/trace_combined.json"
            fi
          fi
          git add .
          git diff --staged --quiet || git commit -m "ci: deploy results to $TARGET_DIR"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
