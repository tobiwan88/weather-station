# FRDM-MCXN947 gateway configuration
# Applied after prj.conf — overrides native_sim-specific settings.

# ---------------------------------------------------------------
# Networking: real Ethernet (replaces native offloaded sockets)
# ---------------------------------------------------------------
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=n
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_IPV6=n

CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_NXP_ENET=y

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y

# Network stack buffers
# 10 contexts: HTTP (1 listen + 3 clients + 1 internal) + MQTT (1) + SNTP (1) + DNS (1) + 2 margin
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y

# DNS resolver
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_ADDITIONAL_BUF_CTR=2

# Network shell + stats
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y

# ---------------------------------------------------------------
# Disable display stack (no hardware display on this board)
# ---------------------------------------------------------------
CONFIG_LVGL_DISPLAY=n
CONFIG_LVGL=n
CONFIG_DISPLAY=n
CONFIG_INPUT=n

# ---------------------------------------------------------------
# Memory tuning (512 KB RAM, Cortex-M33)
# ---------------------------------------------------------------
# NOTE: the project no-heap rule (no k_malloc/k_free in application code) still
# applies.  This pool is required exclusively by MCUmgr's SMP transport
# internals.  Do NOT use it from project code.
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=2048
# Increased from 2048: both fota_reboot_work (sys_reboot) and fota_confirm's
# confirm_work_fn (boot_write_img_confirmed → flash_area_write) run here.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

# ---------------------------------------------------------------
# MCUmgr — SMP protocol over UART for firmware update
# ---------------------------------------------------------------
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUMGR=y
# WARNING: MCUmgr UART transport, the Zephyr shell, and the console all share
# flexcomm4_lpuart4.  MCUmgr installs an ISR-level byte sniffer that detects
# SMP frame delimiters; interleaved shell output can corrupt SMP frames and
# vice versa.  See backlog item FOTA-REMOVE-UART-MCUMGR for the plan to move
# MCUmgr to a dedicated UART.
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# HTTP server needs 8 k_poll_events (1 eventfd + 1 listen + 3×2 client r/w);
# +2 margin for net_socket_service (MQTT/SNTP). Default 3 is too small.
CONFIG_ZVFS_POLL_MAX=10

# MCUmgr SMP requires ZCBOR and CRC
CONFIG_ZCBOR=y
CONFIG_CRC=y

# Increase HTTP server thread stack to accommodate the deep call chain of
# flash_img_buffered_write → stream_flash_buffered_write → flash_area_write/erase.
# The default (3072) is borderline on Cortex-M33 when a FOTA chunk triggers a
# sector erase inline.
CONFIG_HTTP_SERVER_STACK_SIZE=4096

# ---------------------------------------------------------------
# FOTA HTTP endpoints + auto-confirm
# ---------------------------------------------------------------
CONFIG_HTTP_DASHBOARD_FOTA=y
CONFIG_FOTA_CONFIRM=y
CONFIG_FOTA_CONFIRM_DELAY_S=5
CONFIG_FOTA_RELAY=n
