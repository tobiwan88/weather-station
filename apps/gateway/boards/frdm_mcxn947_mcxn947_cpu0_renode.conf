# Renode-specific Kconfig overrides for FRDM-MCXN947.
# Applied after prj.conf and frdm_mcxn947_mcxn947_cpu0.conf.
#
# The Renode .repl models the external W25Q64 flash as bare Memory.MappedMemory
# which cannot respond to SPI IP commands (JEDEC ID read, SFDP, erase/program).
# The flash_mcux_flexspi_nor driver hangs in FLEXSPI_TransferBlocking() waiting
# for IPCMDDONE that never arrives.
#
# Disabling the external FlexSPI NOR driver allows the gateway to boot in
# Renode while keeping internal flash (FTFE) functional for MCUboot/FOTA.
# Settings use SETTINGS_NONE (RAM-only), so no external storage is needed.

CONFIG_FLASH_MCUX_FLEXSPI_NOR=n

# BME688 DT node is disabled in the Renode overlay; explicit Kconfig override
# avoids compiling the BME680 driver when the DT node is unavailable.
CONFIG_BME680=n

# Flexcomm5/LPUART5 is disabled in the Renode overlay (no UART peripheral model);
# without this, uart_lora_bridge logs an error at boot and wastes a thread stack.
CONFIG_UART_LORA_BRIDGE=n

# Re-enable fake sensors for virtual testing. The board-level
# frdm_mcxn947_mcxn947_cpu0.conf overrides prj.conf with CONFIG_FAKE_SENSORS=n
# (for real hardware); this restores them for the Renode simulation.
CONFIG_FAKE_SENSORS=y
CONFIG_FAKE_SENSORS_SHELL=y
