CONFIG_LV_COLOR_DEPTH_32=y
CONFIG_LV_Z_MEM_POOL_SIZE=81920

# FIFO transport: receives sensor-node protobuf readings on /tmp/ws-node-0 (native_sim only)
CONFIG_PIPE_TRANSPORT=y

# The HTTP server polls 1 eventfd + listen socket + HTTP_SERVER_MAX_CLIENTS. With the default
# of 3, parallel browser connections overflowed zvfs_poll() and crashed NSOS (see
# zephyr/patches.yml).
CONFIG_ZVFS_POLL_MAX=12

# Resyncs resolve names with Zephyr's own DNS resolver, which has no server on native_sim
# (giving it one froze the simulator). Use an IP (time.google.com) so they need no lookup.
CONFIG_NET_CONFIG_SNTP_INIT_SERVER="216.239.35.0"
