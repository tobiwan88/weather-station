# Zephyr core
CONFIG_ZBUS=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y
CONFIG_ZBUS_RUNTIME_OBSERVERS_NODE_ALLOC_STATIC=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SETTINGS=y
CONFIG_CRC=y

# Sensor event system
CONFIG_SENSOR_EVENT=y
CONFIG_SENSOR_EVENT_LOG=y
CONFIG_SENSOR_TRIGGER=y

# Sensor registry (required by remote_sensor → lora_radio)
CONFIG_SENSOR_REGISTRY=y

# Remote sensor transport (required by lora_radio)
CONFIG_REMOTE_SENSOR=y

# LoRa radio — real SX126x driver (hardware build)
CONFIG_LORA_RADIO=y
CONFIG_LORA_RADIO_FAKE=n
CONFIG_LORA_RADIO_SHELL=y
CONFIG_LORA_RADIO_DEFAULT_SF=10
CONFIG_LORA_RADIO_DEFAULT_BW=125

# UART bridge to gateway
CONFIG_UART_LORA_SENDER=y
CONFIG_UART_LORA_SENDER_DEV_NAME="usart1"

# Shell commands
CONFIG_FAKE_SENSORS=n

# Disabled features (no display, no HTTP, no MQTT on co-processor)
CONFIG_LVGL_DISPLAY=n
CONFIG_HTTP_DASHBOARD=n
CONFIG_MQTT_PUBLISHER=n
CONFIG_SNTP_SYNC=n
CONFIG_CLOCK_DISPLAY=n
CONFIG_LOCATION_REGISTRY=n
