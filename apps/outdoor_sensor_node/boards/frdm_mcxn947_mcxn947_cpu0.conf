# frdm_mcxn947 overrides for outdoor_sensor_node.
# Disables STM32-specific and Wio-E5 Mini hardware configs from prj.conf.
# Enables fake sensors for basic shell testing in Renode.

# Disable real BME680 driver (no BME688 on this board)
CONFIG_BME680=n

# Disable TX libraries that require real hardware
CONFIG_SENSOR_NODE_TX=n
CONFIG_LORA_NODE=n

# Disable STM32-specific hardware
CONFIG_ENTROPY_STM32_RNG=n
CONFIG_CRYPTO_STM32=n

# Disable NVS/settings persistence (minimal test)
CONFIG_NVS=n
CONFIG_SETTINGS_NVS=n

# Disable LoRa subsystem
CONFIG_LORA=n

# Disable PSA crypto (not needed for minimal test)
CONFIG_PSA_CRYPTO=n

# Disable crypto subsystem
CONFIG_CRYPTO=n

# Enable fake sensors for shell testing
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y
CONFIG_SENSOR_TRIGGER=y
CONFIG_SENSOR_EVENT=y
CONFIG_SENSOR_REGISTRY=y
CONFIG_FAKE_SENSORS=y
CONFIG_FAKE_SENSORS_SHELL=y
CONFIG_FAKE_SENSORS_AUTO_PUBLISH_MS=1000

# Enable shell and logging (inherited from prj.conf, explicit for clarity)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
