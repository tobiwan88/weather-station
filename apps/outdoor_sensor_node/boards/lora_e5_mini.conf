# Hardware-specific config for lora_e5_mini (STM32WLE5JC).
# Enables BME680 sensor library and power management.

CONFIG_BME680_SENSOR=y
# BME680 driver needs I2C_DT_IODEV_DEFINE (only built with I2C_RTIO) when
# CONFIG_SENSOR_ASYNC_API is enabled, which prj.conf sets for SEN0460.
CONFIG_I2C_RTIO=y
CONFIG_PM_DEVICE=y
CONFIG_PM=y
