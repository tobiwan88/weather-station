# native_sim overrides for outdoor_sensor_node.
# Disables STM32-specific and real-hardware configs from prj.conf.
# The app compiles on native_sim with hardware libraries disabled;
# full runtime testing uses Renode on the target SoC.

# Disable real BME680 driver (no fake driver available)
CONFIG_BME680=n

# Enable SEN0460 sensor
CONFIG_SEN0460_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y

# Disable TX libraries that require real hardware
CONFIG_SENSOR_NODE_TX=n
CONFIG_LORA_NODE=n

# Disable STM32-specific hardware
CONFIG_ENTROPY_STM32_RNG=n
CONFIG_CRYPTO_STM32=n

# Disable NVS/settings persistence (not needed for simulation)
CONFIG_NVS=n
CONFIG_SETTINGS_NVS=n
CONFIG_SETTINGS=y

# Disable LoRa subsystem (no fake LoRa driver in this build)
CONFIG_LORA=n

# Disable PSA crypto (requires hardware entropy)
CONFIG_PSA_CRYPTO=n

# Disable crypto subsystem
CONFIG_CRYPTO=n
