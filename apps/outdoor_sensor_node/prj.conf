# Outdoor sensor node application configuration.
# Targets Wio-E5 Mini (STM32WLE5JC) with BME688 sensor and LoRa TX.

CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_SENSOR=y
CONFIG_SENSOR_EVENT=y
CONFIG_SENSOR_TRIGGER=y
CONFIG_SENSOR_REGISTRY=y
CONFIG_HW_SENSOR_UTILS=y
CONFIG_BME680=y
CONFIG_BME680_SENSOR=y

CONFIG_LORA=y
CONFIG_LORA_NODE=y
CONFIG_SENSOR_NODE_TX=y
CONFIG_LORA_NODE_DEFAULT_SF=10
CONFIG_LORA_NODE_DEFAULT_BW=125
CONFIG_LORA_NODE_DEFAULT_FREQ=868000000
CONFIG_LORA_NODE_TX_POWER=14
CONFIG_SENSOR_NODE_TX_INTERVAL_S=60

CONFIG_PSA_CRYPTO=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_COUNTER=y
CONFIG_RTC=y

CONFIG_GPIO=y
CONFIG_I2C=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_STM32_RNG=y

CONFIG_CRYPTO=y
CONFIG_CRYPTO_STM32=y
