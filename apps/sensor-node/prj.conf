# Sensor-node application configuration.
# Lighter than gateway: no auto-publish timer, no registry (optional).

CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_SENSOR_EVENT=y
CONFIG_SENSOR_EVENT_LOG=y
CONFIG_SENSOR_TRIGGER=y
CONFIG_SENSOR_REGISTRY=y
CONFIG_FAKE_SENSORS=y
CONFIG_FAKE_SENSORS_SHELL=y
CONFIG_FAKE_TEMPERATURE_UID_BASE=0x0021
CONFIG_FAKE_HUMIDITY_UID_BASE=0x0022
CONFIG_PIPE_PUBLISHER=y

# LoRa TX subsystem
CONFIG_LORA=y
CONFIG_LORA_RADIO=y
CONFIG_LORA_RADIO_FAKE=y
CONFIG_LORA_NODE=y
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_SENSOR_NODE_TX=y
