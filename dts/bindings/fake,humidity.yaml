description: |
  Fake humidity sensor for native_sim and testing.

  Each DT node with this compatible is instantiated as an independent
  software sensor driver. The driver subscribes to sensor_trigger_chan
  and publishes env_sensor_data events on sensor_event_chan.

compatible: "fake,humidity"

properties:
  initial-value-mpct:
    type: int
    required: true
    description: |
      Initial relative humidity value in milli-percent (%RH × 1000).
      For example, 50000 represents 50.000 %RH.
      Range: 0 .. 100000
