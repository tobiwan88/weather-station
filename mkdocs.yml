site_name: Weather Station Documentation
site_url: https://tobiwan88.github.io/weather-station/
repo_url: https://github.com/tobiwan88/weather-station
repo_name: tobiwan88/weather-station

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - User Guide: user/README.md
  - Hardware: hardware/README.md
  - Architecture:
    - Overview: architecture/README.md
    - System Overview: architecture/system-overview.md
    - Event Bus: architecture/event-bus.md
    - Composition Model: architecture/composition-model.md
    - Concurrency: architecture/concurrency.md
    - Integration Tests: architecture/integration-tests.md
    - Firmware Update: architecture/firmware-update.md
    - LoRa Protocol: architecture/lora-protocol.md
    - Diagrams: architecture/diagrams.md
    - HTTP Dashboard: architecture/http-dashboard.md
    - Fake Sensors: architecture/fake-sensors.md
    - native_sim: architecture/native-sim.md
    - CI and Dev Environment: architecture/ci-dev-environment.md
    - Trace Recorder: architecture/trace-recorder.md
    - Renode Trace Workflow: architecture/renode-trace-workflow.md
  - Decisions: decisions.md
  - Backlog: backlog.md
  - Footprint: https://tobiwan88.github.io/weather-station/dev/bench/

plugins:
  - search
  - glightbox

extra_javascript:
  - javascripts/mermaid-zoom.js

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["docs/architecture/diagrams"]
      check_paths: true
  - admonition
  - pymdownx.details
